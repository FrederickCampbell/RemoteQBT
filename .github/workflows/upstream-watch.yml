name: qBittorrent Upstream Watch

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: qbittorrent-upstream-watch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Audit latest stable qBittorrent release
        id: audit
        run: python scripts/upstream_watch.py

      - name: Nothing changed
        if: steps.audit.outputs.changed != 'true'
        run: echo 'qBittorrent release baseline is current.'

      - name: Safe upstream sync - align identity, CI, merge, release
        if: steps.audit.outputs.changed == 'true' && steps.audit.outputs.safe == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q remoteqbt.py rqbt scripts tests
          python -m unittest discover -s tests -v

          upstream_tag='${{ steps.audit.outputs.tag }}'
          slug="$(echo "$upstream_tag" | tr '/ ' '--')"
          branch="bot/qbittorrent-safe-${slug}"
          release_tag="$(python scripts/release_identity.py sync)"

          git config user.name 'remoteqbt-upstream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$branch"
          git add assets upstream/qbittorrent.json upstream/ui rqbt/version.py README.md AUTOMATION.md BUILD-MANIFEST.json
          git commit -m "chore(upstream): sync qBittorrent $upstream_tag as $release_tag"
          git push --force-with-lease origin "$branch"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(upstream): sync qBittorrent $upstream_tag" \
              --body "Automated qBittorrent-compatible sync.

          Planned RemoteQBT release: \`$release_tag\`

          Safety path:
          1. Explicit Windows CI on this exact commit
          2. Release-identity consistency check
          3. Syntax + unit tests
          4. Real PyInstaller Windows build
          5. Merge only if CI succeeds
          6. Tag/build/publish the qBittorrent-aligned RemoteQBT release")"
            pr="${url##*/}"
          fi

          head_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

          run_id=""
          for _ in $(seq 1 45); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$branch" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$head_sha"'") | .databaseId' | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done

          [ -n "$run_id" ] || { echo "Could not locate dispatched CI run"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

          current_tag="$(python -c 'from rqbt.version import RELEASE_TAG; print(RELEASE_TAG)')"
          qbt_version="$(python -c 'from rqbt.version import QBITTORRENT_VERSION; print(QBITTORRENT_VERSION)')"
          revision="$(python -c 'from rqbt.version import REMOTEQBT_REVISION; print(REMOTEQBT_REVISION)')"

          if ! git rev-parse "$current_tag" >/dev/null 2>&1; then
            git tag -a "$current_tag" -m "RemoteQBT for qBittorrent $qbt_version (r$revision)"
            git push origin "$current_tag"
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$current_tag"

      - name: Review-required upstream change - publish bot branch
        if: steps.audit.outputs.changed == 'true' && steps.audit.outputs.safe != 'true'
        id: review
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.audit.outputs.tag }}'
          slug="$(echo "$tag" | tr '/ ' '--')"
          branch="bot/qbittorrent-review-${slug}"

          git config user.name 'remoteqbt-upstream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$branch"
          git add assets upstream
          git commit -m "chore(upstream): audit qBittorrent $tag" || true
          git push --force-with-lease origin "$branch"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Review qBittorrent $tag compatibility" \
              --body-file upstream/compatibility-report.md)"
            pr="${url##*/}"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Open/update compatibility issue
        if: steps.audit.outputs.changed == 'true' && steps.audit.outputs.safe != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.audit.outputs.tag }}'
          title="qBittorrent $tag requires RemoteQBT review"
          body="$(cat upstream/compatibility-report.md)

          Automated review PR: #${{ steps.review.outputs.pr }}"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n1)"
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
