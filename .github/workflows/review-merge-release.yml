name: Release Merged Upstream Adaptation

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'bot/qbittorrent-review-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate reviewed adaptation
        run: |
          python -m compileall -q remoteqbt.py rqbt scripts tests
          python -m unittest discover -s tests -v

      - name: Prepare qBittorrent-aligned release identity
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          current_tag="$(python -c 'from rqbt.version import RELEASE_TAG; print(RELEASE_TAG)')"
          current_qbt="$(python -c 'from rqbt.version import QBITTORRENT_VERSION; print(QBITTORRENT_VERSION)')"
          baseline_qbt="$(python -c 'import json; x=json.load(open("upstream/qbittorrent.json")); print(x["last_seen_tag"].removeprefix("release-"))')"

          if [ "$current_qbt" = "$baseline_qbt" ] && ! git rev-parse "$current_tag" >/dev/null 2>&1; then
            echo "already_prepared=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$current_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="$(python scripts/release_identity.py sync)"
          rm -f upstream/compatibility-report.md
          branch="bot/release-after-pr-${{ github.event.pull_request.number }}"

          git config user.name 'remoteqbt-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$branch"
          git add -A rqbt/version.py README.md AUTOMATION.md BUILD-MANIFEST.json upstream/compatibility-report.md
          git commit -m "release: prepare $release_tag after upstream adaptation"
          git push origin "$branch"

          url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "release: prepare $release_tag after upstream adaptation" \
            --body "Automated qBittorrent-aligned release-identity update after a human-reviewed compatibility adaptation. This exact commit receives explicit Windows CI before merge.")"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "already_prepared=false" >> "$GITHUB_OUTPUT"

      - name: Explicit Windows CI for release identity
        if: steps.prep.outputs.already_prepared != 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ steps.prep.outputs.branch }}'
          pr='${{ steps.prep.outputs.pr }}'

          head_sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

          run_id=""
          for _ in $(seq 1 45); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$branch" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == "'"$head_sha"'") | .databaseId' | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done

          [ -n "$run_id" ] || { echo "Could not locate dispatched CI run"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      - name: Tag and dispatch Windows release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

          release_tag="$(python -c 'from rqbt.version import RELEASE_TAG; print(RELEASE_TAG)')"
          qbt_version="$(python -c 'from rqbt.version import QBITTORRENT_VERSION; print(QBITTORRENT_VERSION)')"
          revision="$(python -c 'from rqbt.version import REMOTEQBT_REVISION; print(REMOTEQBT_REVISION)')"

          if ! git rev-parse "$release_tag" >/dev/null 2>&1; then
            git tag -a "$release_tag" -m "RemoteQBT for qBittorrent $qbt_version (r$revision)"
            git push origin "$release_tag"
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$release_tag"
